<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0C10"/>
      <stop offset="55%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#C9A86A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F4654"/>
      <stop offset="35%" stop-color="#2A303C"/>
      <stop offset="80%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0"/>
      <stop offset="35%" stop-color="#C9A86A" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#FFF3D1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="1000" height="560" fill="url(#bg)"/>
  <ellipse cx="500" cy="280" rx="450" ry="220" fill="url(#glow)"/>

  <!-- Architectural Studio Light Beams -->
  <line x1="120" y1="60" x2="880" y2="60" stroke="#C9A86A" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="80" y1="395" x2="920" y2="395" stroke="url(#goldLine)" stroke-width="1.5"/>

  <!-- Floor Shadow -->
  <ellipse cx="505" cy="372" rx="375" ry="24" fill="#030406" opacity="0.92"/>
  <ellipse cx="505" cy="375" rx="310" ry="10" fill="#C9A86A" opacity="0.12"/>

  <!-- Car Body Silhouette -->
  <path d="M180,345 L205,270 C235,258 295,250 340,245 L430,188 C480,182 610,184 675,198 L755,265 C790,275 815,295 820,345 C820,358 800,362 775,362 L210,362 C190,362 180,355 180,345 Z" fill="url(#carBody)" stroke="#475569" stroke-width="1.5"/>
  <!-- Rim Light Roofline -->
  <path d="M335,245 L430,185 C485,178 615,180 680,196 L760,265" fill="none" stroke="url(#goldLine)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Greenhouse Windows -->
  <path d="M355,243 L435,196 C485,192 595,192 655,204 L715,252 Z" fill="url(#windowGrad)" stroke="#64748B" stroke-width="1"/>
  <!-- Side Character Crease -->
  <line x1="210" y1="292" x2="780" y2="285" stroke="url(#goldLine)" stroke-width="1.8" opacity="0.75"/>

  <!-- LED Headlight & DRL Signature -->
  <path d="M162,284 L212,276 L205,292 L160,295 Z" fill="#FFFBEB" stroke="#C9A86A" stroke-width="1.5"/>
  <!-- LED Taillight Signature -->
  <path d="M815,272 L855,278 L852,292 L810,288 Z" fill="#EF4444" opacity="0.9"/>

  <!-- Front Alloy Wheel -->
  <g transform="translate(285, 355)">
    <circle r="54" fill="#0B0C0E" stroke="#27272A" stroke-width="8"/>
    <circle r="40" fill="#18181B" stroke="#C9A86A" stroke-width="2"/>
    <circle r="32" fill="none" stroke="#52525B" stroke-width="1.5" stroke-dasharray="10 6"/>
    <circle r="12" fill="#C9A86A"/>
  </g>

  <!-- Rear Alloy Wheel -->
  <g transform="translate(715, 355)">
    <circle r="54" fill="#0B0C0E" stroke="#27272A" stroke-width="8"/>
    <circle r="40" fill="#18181B" stroke="#C9A86A" stroke-width="2"/>
    <circle r="32" fill="none" stroke="#52525B" stroke-width="1.5" stroke-dasharray="10 6"/>
    <circle r="12" fill="#C9A86A"/>
  </g>

  <!-- Top Left Editorial Header -->
  <rect x="48" y="36" width="190" height="28" rx="14" fill="#161922" stroke="#C9A86A" stroke-opacity="0.5"/>
  <text x="143" y="55" fill="#C9A86A" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">ECONOMY</text>

  <!-- Top Right Demo Media Badge -->
  <rect x="650" y="36" width="302" height="28" rx="6" fill="#111318" stroke="#334155" stroke-width="1"/>
  <text x="801" y="54" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">VISUEL STUDIO DÉMO • ÉDITABLE ADMIN</text>

  <!-- Bottom Left Vehicle Nameplate -->
  <text x="50" y="465" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="3">DACIA • MODÈLE 2025</text>
  <text x="50" y="502" fill="#F7F5F0" font-family="Georgia, serif" font-size="30" font-weight="700">Sandero Stepway Expression</text>
  <text x="50" y="528" fill="#C9A86A" font-family="sans-serif" font-size="12" letter-spacing="1.5">KENITRA PRESTIGE RENT CAR • LIVRAISON AÉROPORT &amp; GARE LGV</text>
</svg>